name: Import selected CC0 ambient audio

on:
  push:
    paths:
      - '.github/workflows/import-cc0-ambient.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    if: github.repository == 'diluxlane/Dilux-Lane-Profile'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Retrieve and validate licensed music
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/assets
          curl --fail --location --retry 3 --connect-timeout 15 --max-time 120 \
            'https://opengameart.org/sites/default/files/forest_2_0.ogg' \
            -o /tmp/cathedral-source.ogg || \
            curl --fail --location --retry 3 --connect-timeout 15 --max-time 120 \
            'https://raw.githubusercontent.com/euuuuuuan/moonshard-warden-public/main/src/assets/ambient/oga-cathedral-forest.ogg' \
            -o /tmp/cathedral-source.ogg
          test "$(head -c 4 /tmp/cathedral-source.ogg)" = "OggS"
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1 /tmp/cathedral-source.ogg
          cp /tmp/cathedral-source.ogg public/assets/cathedral-in-the-forest.ogg
          ffmpeg -nostdin -hide_banner -loglevel error -i /tmp/cathedral-source.ogg -vn -ac 2 -ar 44100 -b:a 80k -y public/assets/cathedral-in-the-forest.mp3
          test -s public/assets/cathedral-in-the-forest.mp3
      - name: Commit local audio copies
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/assets/cathedral-in-the-forest.ogg public/assets/cathedral-in-the-forest.mp3
          if ! git diff --cached --quiet; then
            git commit -m 'Vendor CC0 Cathedral in the Forest audio files'
            git push origin HEAD:main
          fi
