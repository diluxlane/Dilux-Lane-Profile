name: Replace profile portrait with full GitHub avatar framing

on:
  push:
    paths:
      - '.github/workflows/refresh-portrait-once.yml'

permissions:
  contents: write

jobs:
  refresh-portrait:
    if: github.repository == 'diluxlane/Dilux-Lane-Profile'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Retrieve original full-frame GitHub avatar
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --connect-timeout 15 --max-time 120 \
            'https://avatars.githubusercontent.com/u/296080722?v=4&size=512' \
            --output /tmp/dilux-github-avatar
          python3 -m pip install --quiet --disable-pip-version-check pillow
          python3 - <<'PY'
          from PIL import Image, ImageOps
          from pathlib import Path
          source = Image.open('/tmp/dilux-github-avatar')
          source.load()
          if source.width < 200 or source.height < 200:
              raise SystemExit('Avatar source is unexpectedly small')
          if source.width != source.height:
              raise SystemExit('Source avatar is not square; refusing to crop')
          avatar = ImageOps.exif_transpose(source).convert('RGB')
          avatar = avatar.resize((512, 512), Image.Resampling.LANCZOS)
          output = Path('public/assets/portrait.webp')
          output.parent.mkdir(parents=True, exist_ok=True)
          avatar.save(output, 'WEBP', quality=86, method=6)
          print(f'Created exact full-frame portrait: {output.stat().st_size} bytes')
          PY
      - name: Commit portrait only
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/assets/portrait.webp
          if ! git diff --cached --quiet; then
            git commit -m 'Match About Me portrait to full GitHub avatar framing'
            git push origin HEAD:main
          fi
